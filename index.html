<!DOCTYPE html>
<html lang="en"
      data-default-theme="minimal"
      data-theme-lock="minimal"
      data-default-mode="light"
      data-default-brand="#0ea5e9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video to Audio Converter</title>

    <script src="coi-serviceworker.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        .v2a-stack { display: grid; gap: var(--crusher-spacing-6); max-width: 36rem; margin-inline: auto; }
        .v2a-section { padding: var(--crusher-spacing-6); display: grid; gap: var(--crusher-spacing-5); }
        .v2a-field { display: grid; gap: var(--crusher-spacing-2); }
        .v2a-label {
            font-size: var(--crusher-font-size-sm);
            color: var(--crusher-text-secondary);
        }
        input[type="file"].crusher-tool-control { padding: var(--crusher-spacing-2); cursor: pointer; }
        .v2a-status-row { display: flex; align-items: center; justify-content: space-between; gap: var(--crusher-spacing-2); }
        .v2a-status {
            block-size: 8rem;
            overflow-y: auto;
            padding: var(--crusher-spacing-3);
            font-family: 'JetBrains Mono', monospace;
            font-size: var(--crusher-font-size-xs);
            line-height: var(--crusher-line-height-relaxed);
            color: var(--crusher-text-primary);
            background: var(--crusher-background-muted);
            border: 1px solid var(--crusher-border-primary);
            border-radius: var(--crusher-radius-lg);
            white-space: pre-wrap;
        }
        .v2a-status::-webkit-scrollbar { width: 8px; }
        .v2a-status::-webkit-scrollbar-track { background: transparent; }
        .v2a-status::-webkit-scrollbar-thumb {
            background-color: var(--crusher-border-primary);
            border-radius: var(--crusher-radius-sm);
        }
        .v2a-log-line { margin-block-end: var(--crusher-spacing-1); }
        .v2a-log-success { color: #16a34a; }
        .v2a-log-error { color: #dc2626; }
        .v2a-spinner {
            display: none;
            inline-size: 1rem; block-size: 1rem;
            color: var(--crusher-color-brand-primary);
            animation: v2a-spin 0.8s linear infinite;
        }
        .v2a-spinner[data-visible="true"] { display: inline-flex; }
        @keyframes v2a-spin { to { transform: rotate(360deg); } }
        .v2a-downloads { display: grid; gap: var(--crusher-spacing-3); }
        .v2a-download {
            display: inline-flex; align-items: center; justify-content: center;
            gap: var(--crusher-spacing-2);
            padding-inline: var(--crusher-spacing-4); padding-block: var(--crusher-spacing-3);
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            border-radius: var(--crusher-radius-lg);
        }
    </style>
</head>
<body class="crusher-tool-page">

    <main class="crusher-tool-shell">
        <header class="crusher-tool-header">
            <h1 class="crusher-tool-title">Video to Audio</h1>
            <p class="crusher-tool-lede">Convert video files to MP3 locally.</p>
        </header>

        <div class="v2a-stack">
            <section class="crusher-tool-surface v2a-section">
                <div class="v2a-field">
                    <label for="uploader" class="v2a-label">Select Video Files</label>
                    <input type="file" id="uploader" multiple accept="video/*" class="crusher-tool-control">
                </div>

                <div class="v2a-field">
                    <div class="v2a-status-row">
                        <span class="v2a-label">Status</span>
                        <span id="spinner" class="v2a-spinner" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        </span>
                    </div>
                    <div id="status" class="v2a-status">Initializing engine...</div>
                </div>

                <div id="downloads" class="v2a-downloads"></div>
            </section>
        </div>
    </main>

    <template id="download-btn-template">
        <a class="crusher-tool-action v2a-download" download>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span class="v2a-download-label"></span>
        </a>
    </template>

    <a href="https://tools.muhammadhassaanjaved.com/" id="hub-bubble" class="crusher-tool-fab" title="View All Tools" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
    </a>

    <crusher-style-switcher
      default-theme="minimal"
      default-brand="#0ea5e9"
      hide-themes
      hide-theme-color></crusher-style-switcher>
    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js"></script>

    <script>
        // Using the v0.10.1 API which is more stable for CDNs
        const { createFFmpeg, fetchFile } = FFmpeg;
        let ffmpeg = null;

        const statusEl = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const downloadsEl = document.getElementById('downloads');
        const downloadTpl = document.getElementById('download-btn-template');

        function setSpinner(visible) {
            spinner.dataset.visible = visible ? 'true' : 'false';
        }

        function clearStatus() {
            statusEl.replaceChildren();
        }

        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = 'v2a-log-line';
            if (type === 'success') line.classList.add('v2a-log-success');
            else if (type === 'error') line.classList.add('v2a-log-error');
            line.textContent = msg;
            statusEl.appendChild(line);
            statusEl.scrollTop = statusEl.scrollHeight;
        }

        const loadFFmpeg = async () => {
            if (ffmpeg) return;

            ffmpeg = createFFmpeg({
                log: false,
                corePath: 'https://unpkg.com/@ffmpeg/core@0.10.0/dist/ffmpeg-core.js'
            });

            setSpinner(true);
            try {
                log('Downloading engine files (v0.10)...');
                await ffmpeg.load();
                clearStatus();
                log('Engine Ready. Please select a video file.', 'success');
            } catch (e) {
                log('Engine Failed: ' + e.message, 'error');
                console.error(e);
            }
            setSpinner(false);
        };

        const transcode = async ({ target: { files } }) => {
            if (files.length === 0) return;
            downloadsEl.replaceChildren();
            clearStatus();

            if (!ffmpeg || !ffmpeg.isLoaded()) {
                await loadFFmpeg();
            }

            // Double check if load succeeded
            if (!ffmpeg.isLoaded()) return;

            setSpinner(true);

            for (const file of files) {
                const name = file.name;
                const outputName = name.replace(/\.[^/.]+$/, '') + '.mp3';

                log(`Processing: ${name}...`);

                try {
                    // Write file to memory
                    ffmpeg.FS('writeFile', name, await fetchFile(file));

                    // Run conversion
                    await ffmpeg.run('-i', name, '-vn', '-acodec', 'libmp3lame', '-q:a', '2', outputName);

                    // Read result
                    const data = ffmpeg.FS('readFile', outputName);

                    // Create download link from template
                    const fragment = downloadTpl.content.cloneNode(true);
                    const link = fragment.querySelector('a');
                    const label = fragment.querySelector('.v2a-download-label');
                    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));
                    link.href = url;
                    link.download = outputName;
                    label.textContent = `Download ${outputName}`;
                    downloadsEl.appendChild(fragment);

                    log(`Finished: ${outputName}`, 'success');

                    // Cleanup memory
                    try {
                        ffmpeg.FS('unlink', name);
                        ffmpeg.FS('unlink', outputName);
                    } catch (e) { /* ignore unlink errors */ }
                } catch (err) {
                    log(`Error converting ${name}: ${err.message}`, 'error');
                }
            }
            setSpinner(false);
        };

        document.getElementById('uploader').addEventListener('change', transcode);

        log('Select a video file to load the conversion engine.');
    </script>
</body>
</html>
