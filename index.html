    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css" integrity="sha384-QYfQeMTJKWZuoEgfBv8ZvJwG12qr6YW8SF6ziK3aHL9luxKjnoswdj/yek7EwpJN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css" integrity="sha384-+mIUnYgeB+0Qf10OjT3tSbT2al2Y8erQfw/uws4os7AxVKNLYeEUW5zHUehGBTVq" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js" integrity="sha384-gNDnPKn5AoF0e4Q555fGbM+snO+UCP3/z4ErG3cyS/Akusg/bzTO+AYmG1WAMnab" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        .v2a-stack { display: grid; gap: var(--crusher-spacing-6); max-width: 36rem; margin-inline: auto; }
        .v2a-section { padding: var(--crusher-spacing-6); display: grid; gap: var(--crusher-spacing-5); }
        .v2a-field { display: grid; gap: var(--crusher-spacing-2); }
        .v2a-label {
            font-size: var(--crusher-font-size-sm);
            color: var(--crusher-text-secondary);
        }
        input[type="file"].crusher-tool-control { padding: var(--crusher-spacing-2); cursor: pointer; }
        .v2a-status-row { display: flex; align-items: center; justify-content: space-between; gap: var(--crusher-spacing-2); }
        .v2a-status {
            block-size: 8rem;
            overflow-y: auto;
            padding: var(--crusher-spacing-3);
            font-family: 'JetBrains Mono', monospace;
            font-size: var(--crusher-font-size-xs);
            line-height: var(--crusher-line-height-relaxed);
            color: var(--crusher-text-primary);
            background: var(--crusher-background-muted);
            border: 1px solid var(--crusher-border-primary);
            border-radius: var(--crusher-radius-lg);
            white-space: pre-wrap;
        }
        .v2a-status::-webkit-scrollbar { width: 8px; }
        .v2a-status::-webkit-scrollbar-track { background: transparent; }
        .v2a-status::-webkit-scrollbar-thumb {
            background-color: var(--crusher-border-primary);
            border-radius: var(--crusher-radius-sm);
        }
        .v2a-log-line { margin-block-end: var(--crusher-spacing-1); }
        .v2a-log-success { color: #16a34a; }
        .v2a-log-error { color: #dc2626; }
        .v2a-spinner {
            display: none;
            inline-size: 1rem; block-size: 1rem;
            color: var(--crusher-color-brand-primary);
            animation: v2a-spin 0.8s linear infinite;
        }
        .v2a-spinner[data-visible="true"] { display: inline-flex; }
        @keyframes v2a-spin { to { transform: rotate(360deg); } }
        .v2a-downloads { display: grid; gap: var(--crusher-spacing-3); }
        .v2a-download {
            display: inline-flex; align-items: center; justify-content: center;
            gap: var(--crusher-spacing-2);
            padding-inline: var(--crusher-spacing-4); padding-block: var(--crusher-spacing-3);
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            border-radius: var(--crusher-radius-lg);
        }

        .tool-feedback {
            width: min(100%, 56rem);
            margin: var(--crusher-spacing-8) auto var(--crusher-spacing-6);
            padding-inline: var(--crusher-spacing-4);
        }
        .tool-feedback-trigger {
            cursor: pointer;
            padding: var(--crusher-spacing-2) var(--crusher-spacing-3);
            font-size: var(--crusher-font-size-sm);
            color: var(--crusher-text-secondary);
            border-radius: var(--crusher-radius-md);
            list-style: none;
            display: inline-flex;
            align-items: center;
            gap: var(--crusher-spacing-2);
            transition: color var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard);
        }
        .tool-feedback-trigger::-webkit-details-marker { display: none; }
        .tool-feedback-trigger::before {
            content: '+';
            display: inline-block;
            font-weight: 700;
            color: var(--crusher-color-brand-primary);
        }
        .tool-feedback-details[open] .tool-feedback-trigger::before { content: '−'; }
        .tool-feedback-trigger:hover { color: var(--crusher-color-brand-primary); }
        .tool-feedback-form {
            margin-top: var(--crusher-spacing-3);
            padding: var(--crusher-spacing-4);
            border: 1px solid var(--crusher-border-primary);
            border-radius: var(--crusher-radius-lg);
            background: var(--crusher-background-surface);
            display: grid;
            gap: var(--crusher-spacing-3);
        }
        .tool-feedback-field { display: grid; gap: var(--crusher-spacing-1); }
        .tool-feedback-field > span {
            font-size: var(--crusher-font-size-xs);
            color: var(--crusher-text-secondary);
            font-weight: 500;
        }
        .tool-feedback-submit {
            padding-inline: var(--crusher-spacing-4);
            padding-block: var(--crusher-spacing-2);
        }
        .tool-feedback-submit[disabled] { opacity: 0.6; cursor: not-allowed; }
        .tool-feedback-status {
            margin: 0;
            min-block-size: 1.25rem;
            font-size: var(--crusher-font-size-sm);
            color: var(--crusher-text-secondary);
        }
        .tool-feedback-status[data-kind="ok"] { color: var(--crusher-color-brand-primary); }
        .tool-feedback-status[data-kind="error"] { color: #dc2626; }
        .tool-feedback-honey { position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="crusher-tool-page">

    <main class="crusher-tool-shell">
        <header class="crusher-tool-header">
            <h1 class="crusher-tool-title">Video to Audio</h1>
            <p class="crusher-tool-lede">Convert video files to MP3 locally.</p>
        </header>

        <div class="v2a-stack">
            <section class="crusher-tool-surface v2a-section">
                <div class="v2a-field">
                    <label for="uploader" class="v2a-label">Select Video Files</label>
                    <input type="file" id="uploader" multiple accept="video/*" class="crusher-tool-control">
                </div>

                <div class="v2a-field">
                    <div class="v2a-status-row">
                        <span class="v2a-label">Status</span>
                        <span id="spinner" class="v2a-spinner" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        </span>
                    </div>
                    <div id="status" class="v2a-status">Initializing engine...</div>
                </div>

                <div id="downloads" class="v2a-downloads"></div>
            </section>
        </div>
    </main>

    <template id="download-btn-template">
        <a class="crusher-tool-action v2a-download" download>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span class="v2a-download-label"></span>
        </a>
    </template>

    <a href="https://tools.muhammadhassaanjaved.com/" id="hub-bubble" class="crusher-tool-fab" title="View All Tools" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
    </a>

    <crusher-style-switcher
      default-theme="minimal"
      default-brand="#0ea5e9"
      hide-themes
      hide-theme-color>
        <svg slot="mode-light-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"/></svg>
        <svg slot="mode-dark-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/></svg>
    </crusher-style-switcher>
    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js" integrity="sha384-RkuNGzCebUwZ5RZDFSKGQ7sDaUpdPfDxO088yXDMPM5CvJ4eBy2Jf/UhLwGay/4K" crossorigin="anonymous"></script>

    <script>
        // Using the v0.10.1 API which is more stable for CDNs
        const { createFFmpeg, fetchFile } = FFmpeg;
        let ffmpeg = null;

        const statusEl = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const downloadsEl = document.getElementById('downloads');
        const downloadTpl = document.getElementById('download-btn-template');

        function setSpinner(visible) {
            spinner.dataset.visible = visible ? 'true' : 'false';
        }

        function clearStatus() {
            statusEl.replaceChildren();
        }

        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = 'v2a-log-line';
            if (type === 'success') line.classList.add('v2a-log-success');
            else if (type === 'error') line.classList.add('v2a-log-error');
            line.textContent = msg;
            statusEl.appendChild(line);
            statusEl.scrollTop = statusEl.scrollHeight;
        }

        const loadFFmpeg = async () => {
            if (ffmpeg) return;

            ffmpeg = createFFmpeg({
                log: false,
                corePath: 'https://unpkg.com/@ffmpeg/core@0.10.0/dist/ffmpeg-core.js'
            });

            setSpinner(true);
            try {
                log('Downloading engine files (v0.10)...');
                await ffmpeg.load();
                clearStatus();
                log('Engine Ready. Please select a video file.', 'success');
            } catch (e) {
                log('Engine Failed: ' + e.message, 'error');
                console.error(e);
            }
            setSpinner(false);
        };

        const transcode = async ({ target: { files } }) => {
            if (files.length === 0) return;
            downloadsEl.replaceChildren();
            clearStatus();

            if (!ffmpeg || !ffmpeg.isLoaded()) {
                await loadFFmpeg();
            }

            // Double check if load succeeded
            if (!ffmpeg.isLoaded()) return;

            setSpinner(true);

            for (const file of files) {
                const name = file.name;
                const outputName = name.replace(/\.[^/.]+$/, '') + '.mp3';

                log(`Processing: ${name}...`);

                try {
                    // Write file to memory
                    ffmpeg.FS('writeFile', name, await fetchFile(file));

                    // Run conversion
                    await ffmpeg.run('-i', name, '-vn', '-acodec', 'libmp3lame', '-q:a', '2', outputName);

                    // Read result
                    const data = ffmpeg.FS('readFile', outputName);

                    // Create download link from template
                    const fragment = downloadTpl.content.cloneNode(true);
                    const link = fragment.querySelector('a');
                    const label = fragment.querySelector('.v2a-download-label');
                    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));
                    link.href = url;
                    link.download = outputName;
                    label.textContent = `Download ${outputName}`;
                    downloadsEl.appendChild(fragment);

                    log(`Finished: ${outputName}`, 'success');

                    // Cleanup memory
                    try {
                        ffmpeg.FS('unlink', name);
                        ffmpeg.FS('unlink', outputName);
                    } catch (e) { /* ignore unlink errors */ }
                } catch (err) {
                    log(`Error converting ${name}: ${err.message}`, 'error');
                }
            }
            setSpinner(false);
        };

        document.getElementById('uploader').addEventListener('change', transcode);

        log('Select a video file to load the conversion engine.');
    </script>

    <section class="tool-feedback" aria-label="Tool feedback">
        <details class="tool-feedback-details">
            <summary class="tool-feedback-trigger">Suggest an improvement</summary>
            <form id="tool-feedback-form" class="tool-feedback-form" novalidate>
                <label class="tool-feedback-field">
                    <span>What could be better?</span>
                    <textarea name="improvement" rows="3" required maxlength="2000" class="crusher-tool-control" placeholder="Tell me what's missing or what could work better…"></textarea>
                </label>
                <label class="tool-feedback-field">
                    <span>Your email (optional, only if you want a reply)</span>
                    <input type="email" name="replyto" maxlength="200" class="crusher-tool-control" placeholder="your@email.com">
                </label>
                <input type="text" name="botcheck" class="tool-feedback-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div>
                    <button type="submit" class="crusher-tool-action tool-feedback-submit">Send</button>
                </div>
                <p id="tool-feedback-status" class="tool-feedback-status" role="status" aria-live="polite"></p>
            </form>
        </details>
    </section>

    <script>
        (function() {
            const KEY = '30e570c5-aeeb-439d-8a8a-bd2516a5dc5d';
            const ENDPOINT = 'https://api.web3forms.com/submit';
            const form = document.getElementById('tool-feedback-form');
            const status = document.getElementById('tool-feedback-status');
            if (!form || !status) return;
            const toolName = (document.title || 'tool').trim();
            const subject = '[' + toolName + '] Improvement suggestion';
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(form);
                fd.set('access_key', KEY);
                fd.set('subject', subject);
                fd.set('from_name', toolName);
                const btn = form.querySelector('button[type="submit"]');
                const orig = btn.textContent;
                btn.disabled = true; btn.textContent = 'Sending…';
                status.textContent = ''; delete status.dataset.kind;
                try {
                    const res = await fetch(ENDPOINT, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
                    const data = await res.json();
                    if (data.success) {
                        form.reset();
                        status.textContent = 'Thanks — your suggestion is in.';
                        status.dataset.kind = 'ok';
                    } else {
                        status.textContent = data.message || 'Sorry, that did not go through. Try again later?';
                        status.dataset.kind = 'error';
                    }
                } catch (err) {
                    status.textContent = 'Network error. Try again?';
                    status.dataset.kind = 'error';
                } finally {
                    btn.disabled = false; btn.textContent = orig;
                }
            });
        })();
    </script>

</body>
